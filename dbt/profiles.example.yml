# Copy to ~/.dbt/profiles.yml and fill in.
#
# PG_DATABASE must be the ANALYTICS database (alloydb_bi_dev_01), NOT a service
# database and NOT `postgres`. Each microservice owns its own AlloyDB database
# and PostgreSQL cannot join across them; the analytics database carries
# postgres_fdw foreign tables for the eight services the models read. See
# /fdw/README.md.
#
# PostgreSQL is the only target. The source definitions in
# models/sources/_sources.yml are Postgres-shaped - plain schemas, no
# CHARGERFLEET database prefix - so they do not resolve against Snowflake.
#
# Snowflake is reference only: read view DDL from it, then delete it.
# Validate the port by comparing FINAL NUMBERS (see analyses/), not by running
# dbt against Snowflake.
#
charger_bi:
  target: postgres
  outputs:

    postgres:
      type: postgres
      host: "{{ env_var('PG_HOST') }}"
      user: "{{ env_var('PG_USER') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('PG_DATABASE') }}"
      schema: reporting
      threads: 4
      sslmode: require
      # dbt WRITES tables, so this cannot be the AlloyDB read pool.
      # Point it at a writable instance; Cube then READS from the read pool.
      # Two different connections on purpose.

    # Optional second target for a dev schema on the same instance
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST') }}"
      user: "{{ env_var('PG_USER') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('PG_DATABASE') }}"
      schema: "reporting_dev_{{ env_var('USER', 'local') }}"
      threads: 4
      sslmode: require
