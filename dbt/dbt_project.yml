name: 'charger_bi'
version: '1.0.0'
config-version: 2
profile: 'charger_bi'

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # --- Magic IDs lifted out of the original Snowflake views -------------------
  # Documented here so nobody has to guess what a bare GUID means again.
  order_status_cancelled_id:        'ABD88AC0-5970-40DA-8382-53DD000300B7'
  invoice_status_void_id:           '8ACBC9AB-0298-43E1-85C7-DDE861F8B32C'
  adjustment_reason_billable_id:    '056CD084-9779-4BC6-B138-675AF9718760'
  role_sales_rep_id:                '588C2A53-736C-491A-B1C7-3EF0B29ACFB3'
  role_spot_bid_lead_id:            'DF39571B-5254-4210-B17E-277280B06822'
  role_account_manager_id:          '73661DC2-A21A-4987-8AFC-C3203B313639'
  role_csr_id:                      '38AB7753-8F16-4D24-97E7-EBBCAEFD354F'
  # Order numbers below this are legacy/test data (from ORDERCHARGES_WITHADJUSTMENT_VW)
  min_order_number:                 10000000
  # Brokerage P&L only considers orders delivered on or after this date
  brokerage_start_date:             '2024-01-01'

models:
  charger_bi:
    +materialized: view
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
