version: 2

models:
  - name: fct_order_revenue
    description: >
      One row per order. The single table the Cube semantic model sits on.
      Ports the custom SQL from the Revenue Performance Analysis Tableau
      workbook, minus currency conversion, predicted revenue and the brokerage
      P&L. Money is in the ORDER'S OWN CURRENCY - order_currency is a mandatory
      slice on any revenue figure. Revenue exists only for INVOICED orders;
      non-invoiced orders keep their row with NULL revenue.

    # data_type is declared on EVERY column on purpose. Cube's dbt integration
    # infers dimension types from data_type first, the warehouse catalog second,
    # and COLUMN-NAME HEURISTICS third. Declaring types here stops the heuristics
    # from ever running, and stops Cube auto-generating a SUM measure on a
    # column where summing makes no sense.
    columns:

      - name: orderno
        description: Order number. Primary key.
        data_type: numeric
        tests:
          - unique          # unique + not_null is the pair that tells Cube
          - not_null        # this is the primary key

      - name: orderguid
        description: Order GUID, join key to the operational tables.
        data_type: text
        tests: [not_null]

      - name: customer
        description: Customer legal business name. 1,756 distinct values.
        data_type: text

      - name: salesrep
        description: Sales rep, upper-cased. 'NONE' when unassigned. 133 distinct.
        data_type: text

      - name: pickcity
        data_type: text
      - name: pickstate
        data_type: text
      - name: pickcountry
        description: Mapped from single letters - C to CAN, U to USA, M to MEX.
        data_type: text
      - name: delcity
        data_type: text
      - name: delstate
        data_type: text
      - name: delcountry
        description: Mapped from single letters - C to CAN, U to USA, M to MEX.
        data_type: text

      - name: lane
        description: Origin-destination lane. 24,537 distinct - do not use as a default dimension.
        data_type: text

      - name: spot_status
        description: Spot flag. Two values.
        data_type: text

      - name: pickedupdate
        data_type: timestamp

      - name: delivereddate
        description: >
          The reporting date for every dashboard. Filtered to
          reporting_start_date and later.
        data_type: timestamp
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "<= current_date + interval '1 day'"
              config:
                severity: warn
                error_if: ">1000"
              # The Tableau workbook defines a "Del Date less than today" guard
              # (delivereddate <= today AND >= 2024-01-01 AND pickedupdate <= tomorrow)
              # but applies it to NO sheet. This test surfaces what that guard
              # would have caught. Decide whether to enforce it.

      - name: invoicedate
        description: NULL for orders that are not invoiced.
        data_type: timestamp

      - name: invoicestatus
        description: >
          Raw upstream status. revenue_status is the two-value version the
          dashboards use; this is kept for drill-down.
        data_type: text

      - name: revenue_status
        description: >
          INVOICED or NOT INVOICED. Revenue is NULL for NOT INVOICED - there is
          no modelled figure behind them any more.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              values: ['INVOICED', 'NOT INVOICED']

      # --- currency ---------------------------------------------------------
      - name: order_currency_code
        description: Single-character code as stored - C, U or P.
        data_type: text
        tests:
          - accepted_values:
              values: ['C', 'U', 'P']
              config:
                severity: warn
              # warn, not error: an unmapped code makes order_currency NULL,
              # which the test below catches as a hard failure. This one tells
              # you WHICH code appeared.

      - name: order_currency
        description: >
          CAD, USD or MXN. MANDATORY SLICE on every money column below.
          Nothing here is FX-converted, so a revenue total that is not grouped
          by this column adds Canadian dollars to US dollars to Mexican pesos.
        data_type: text
        tests:
          - accepted_values:
              values: ['CAD', 'USD', 'MXN']

      # --- revenue, all in order_currency -----------------------------------
      - name: order_revenue
        description: >
          Total order revenue including fuel surcharge, in the order's own
          currency. NULL when the order is not invoiced. Additive WITHIN a
          currency only.
        data_type: numeric

      - name: order_fsc_revenue
        description: >
          Fuel-surcharge revenue, in the order's own currency. NULL when not
          invoiced. Additive within a currency only.
        data_type: numeric

      - name: order_revenue_ex_fsc
        description: >
          order_revenue minus order_fsc_revenue. NULL when not invoiced.
          Additive within a currency only.
        data_type: numeric

      # --- manual charges ---------------------------------------------------
      - name: manual_charges
        description: >
          Manual (off-invoice) charges expressed in the ORDER'S currency, so it
          can be added to order_revenue without conversion. Charges billed in
          any other currency are excluded - see
          manual_charges_currency_mismatch.
        data_type: numeric

      - name: manual_charges_currency_mismatch
        description: >
          TRUE when the order carries manual charges in a currency other than
          its own, meaning those amounts are dropped from manual_charges.
          Query 3 in analyses/validate_dashboard_numbers.sql quantifies the
          damage. If it is material, FX is not optional after all.
        data_type: boolean
        tests: [not_null]

      - name: manual_charges_cad
        description: Raw manual charges billed in CAD. Kept for drill-down.
        data_type: numeric
      - name: manual_charges_usd
        description: Raw manual charges billed in USD. Kept for drill-down.
        data_type: numeric
      - name: manual_charges_mxn
        description: Raw manual charges billed in MXN. Kept for drill-down.
        data_type: numeric
