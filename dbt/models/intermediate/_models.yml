version: 2

models:
  - name: int_fx_rates_daily
    description: >
      Port of BOCDAILYFXRATES_VW. Dense daily FX calendar per currency from
      2017-01-03, forward-filling the last known rate over weekends and gaps.
      Reads WORKDAYBI - the one non-Postgres dependency in this chain.
    columns:
      - name: calendardate
        data_type: date
      - name: sourcecurrencycode
        description: C = CAD, U = USD, P = MXN.
        data_type: text
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [calendardate, sourcecurrencycode]

  - name: int_order_users
    description: Port of the ORDERUSERS CTE. Pivots order-user rows into one column per role.
    columns:
      - name: orderguid
        data_type: text
        tests: [unique, not_null]

  - name: int_charge_adjustments
    description: Port of the ADJUSTMENT CTE. Billable invoice adjustments split into FRT/FSC/EXTRA.
    columns:
      - name: orderguid
        data_type: text

  - name: int_manual_charges
    description: Port of the ADJ_BY_INVOICE + RAW_MANUAL + MANUAL CTEs. Manual invoices by currency.
    columns:
      - name: orderguid
        data_type: text
        tests: [unique]

  - name: int_order_charges
    description: Port of the ORDERCHARGE CTE. Order-grain charges with two-item tax calculation.
    columns:
      - name: orderguid
        data_type: text
        tests: [unique, not_null]

  - name: int_order_charges_with_adjustment
    description: >
      Full port of ORDERCHARGES_WITHADJUSTMENT_VW - the most-queried object in
      the revenue chain (10,894 queries / 90 days, 11 users). Materialised as a
      table. Contains the Labatt shuttle reclassification rule - see model header.
    columns:
      - name: orderguid
        data_type: text
        tests: [not_null]
      - name: invoicestatus
        data_type: text
        tests:
          - accepted_values:
              values: ['INVOICED', 'NOT INVOICED']

  - name: int_ts_hybrid_brokerage_pnl
    description: >
      Port of TSHYBRIDBROKERAGEPANDL_VW. Needed only by the Revenue Execution
      dashboards. Depends on GLOBALBROKERAGEANALYSIS, which is not ported yet.
      Contains hardcoded trailer/transfer cost rates - move to a seed.
    columns:
      - name: orderguid
        data_type: text

  - name: int_opd_miles
    description: >
      Port of OPD_MILES_VW (populates OPD_MILES, 1,114,454 rows). Rebuilds each
      order's journey from probill stops, prices each leg from
      ADDRESSSVC.TRAVELTIME, and rolls it up to one row per order with lanes,
      compass direction, distance band and total miles.
      Reads only CHARGERFLEET - no external systems.
      NOTE: the original appends a random UUID as `id` on every run. Omitted
      here - a surrogate key that changes on every build is not usable
      downstream. `orderguid` is the key.
    columns:
      - name: orderguid
        data_type: text
        tests: [unique, not_null]
      - name: total_distance
        description: NULL unless every leg had a mileage - a partial total would be wrong.
        data_type: numeric
      - name: distancetype
        description: VERY SHORT <20, SHORT 20-100, MEDIUM 100-500, LONG 500-3000, VERY LONG >3000 miles.
        data_type: text
        tests:
          - accepted_values:
              values: ['VERY SHORT','SHORT','MEDIUM','LONG','VERY LONG']
      - name: od_lane_distinct
        description: First origin to last destination, ignoring intermediate stops.
        data_type: text
      - name: roundtrip_check
        description: True when the order has both NB and SB legs.
        data_type: boolean

  - name: int_predicted_revenue
    description: >
      Port of PREDICTED_REVENUE_BS_VW (populates PREDICTED_REVENUE_BS,
      1,115,472 rows). Estimates revenue for un-invoiced orders via six hard
      overrides then a 12-step fallback cascade; invoiced orders pass through
      with actual charges. The `source` column records which rule fired -
      always check it before trusting a number.
      Still depends on the ten AVG_REVENUE_BY_* views and on
      ORDERCHARGES_BS_VW, which reads OPSYNC and is therefore not portable to
      Postgres as-is.
    columns:
      - name: orderguid
        data_type: text
        tests: [not_null]
      - name: predicted_revenue
        description: >
          Actual charges when invoiced, otherwise an estimate. Forced to 1 by
          the five override rules (non-billable PO, Ryder/Penske return routes,
          Honda northbound) so those orders contribute effectively nothing.
        data_type: numeric
      - name: source
          
        description: Which rule produced the value. 18 possible values.
        data_type: text

