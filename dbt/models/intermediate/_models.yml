version: 2

models:
  - name: int_fx_rates_daily
    description: >
      Port of BOCDAILYFXRATES_VW. Dense daily FX calendar per currency from
      2017-01-03, forward-filling the last known rate over weekends and gaps.
      Reads WORKDAYBI - the one non-Postgres dependency in this chain.
    columns:
      - name: calendardate
        data_type: date
      - name: sourcecurrencycode
        description: C = CAD, U = USD, P = MXN.
        data_type: text
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [calendardate, sourcecurrencycode]

  - name: int_order_users
    description: Port of the ORDERUSERS CTE. Pivots order-user rows into one column per role.
    columns:
      - name: orderguid
        data_type: text
        tests: [unique, not_null]

  - name: int_charge_adjustments
    description: Port of the ADJUSTMENT CTE. Billable invoice adjustments split into FRT/FSC/EXTRA.
    columns:
      - name: orderguid
        data_type: text

  - name: int_manual_charges
    description: Port of the ADJ_BY_INVOICE + RAW_MANUAL + MANUAL CTEs. Manual invoices by currency.
    columns:
      - name: orderguid
        data_type: text
        tests: [unique]

  - name: int_order_charges
    description: Port of the ORDERCHARGE CTE. Order-grain charges with two-item tax calculation.
    columns:
      - name: orderguid
        data_type: text
        tests: [unique, not_null]

  - name: int_order_charges_with_adjustment
    description: >
      Full port of ORDERCHARGES_WITHADJUSTMENT_VW - the most-queried object in
      the revenue chain (10,894 queries / 90 days, 11 users). Materialised as a
      table. Contains the Labatt shuttle reclassification rule - see model header.
    columns:
      - name: orderguid
        data_type: text
        tests: [not_null]
      - name: invoicestatus
        data_type: text
        tests:
          - accepted_values:
              values: ['INVOICED', 'NOT INVOICED']

  - name: int_ts_hybrid_brokerage_pnl
    description: >
      Port of TSHYBRIDBROKERAGEPANDL_VW. Needed only by the Revenue Execution
      dashboards. Depends on GLOBALBROKERAGEANALYSIS, which is not ported yet.
      Contains hardcoded trailer/transfer cost rates - move to a seed.
    columns:
      - name: orderguid
        data_type: text

  - name: int_opd_miles
    description: >
      Port of OPD_MILES_VW (populates OPD_MILES, 1,114,454 rows). Rebuilds each
      order's journey from probill stops, prices each leg from
      ADDRESSSVC.TRAVELTIME, and rolls it up to one row per order with lanes,
      compass direction, distance band and total miles.
      Reads only CHARGERFLEET - no external systems.
      NOTE: the original appends a random UUID as `id` on every run. Omitted
      here - a surrogate key that changes on every build is not usable
      downstream. `orderguid` is the key.
    columns:
      - name: orderguid
        data_type: text
        tests: [unique, not_null]
      - name: total_distance
        description: NULL unless every leg had a mileage - a partial total would be wrong.
        data_type: numeric
      - name: distancetype
        description: VERY SHORT <20, SHORT 20-100, MEDIUM 100-500, LONG 500-3000, VERY LONG >3000 miles.
        data_type: text
        tests:
          - accepted_values:
              values: ['VERY SHORT','SHORT','MEDIUM','LONG','VERY LONG']
      - name: od_lane_distinct
        description: First origin to last destination, ignoring intermediate stops.
        data_type: text
      - name: roundtrip_check
        description: True when the order has both NB and SB legs.
        data_type: boolean

  - name: int_predicted_revenue
    description: >
      Port of PREDICTED_REVENUE_BS_VW (populates PREDICTED_REVENUE_BS,
      1,115,472 rows). Estimates revenue for un-invoiced orders via six hard
      overrides then a 12-step fallback cascade; invoiced orders pass through
      with actual charges. The `source` column records which rule fired -
      always check it before trusting a number.
      Still depends on the ten AVG_REVENUE_BY_* views and on
      ORDERCHARGES_BS_VW, which reads OPSYNC and is therefore not portable to
      Postgres as-is.
    columns:
      - name: orderguid
        data_type: text
        tests: [not_null]
      - name: predicted_revenue
        description: >
          Actual charges when invoiced, otherwise an estimate. Forced to 1 by
          the five override rules (non-billable PO, Ryder/Penske return routes,
          Honda northbound) so those orders contribute effectively nothing.
        data_type: numeric
      - name: source
          
        description: Which rule produced the value. 18 possible values.
        data_type: text

  - name: int_tonu_orders
    description: >
      Port of TONUORDERSBI_VW. Orders whose probills have NO trip events -
      truck ordered, nothing moved. Used as an exclusion list by the Labatt
      allocation and the predicted-revenue cascade.
    columns:
      - name: orderid
        data_type: text
        tests: [unique, not_null]
      - name: totalevent
        description: Always 0 by construction.
        data_type: numeric

  - name: int_keurig_shunting_revenue
    description: >
      Port of KEURIG_SHUNTINGREVENUE_VW. Average revenue for Keurig yard
      shunting - zero-distance moves within Quebec, which is why they cannot be
      rated per mile like everything else. Last step of the cascade.
      Rolling 3-month window on invoice date, so the value moves over time.
    columns:
      - name: od_statelane_distinct
        description: Always 'QC - QC' by construction.
        data_type: text
      - name: avg_revenue
        data_type: numeric

  - name: int_order_extra_charges
    description: >
      Port of ORDEREXTRACHARGES_VW. Two JSON blobs per order breaking down
      "extra" charges (neither freight nor fuel) by charge code, nested by
      currency. Unions order charges, billable adjustments and manual invoice
      lines.
      Uses jsonb_object_agg, which ERRORS on a null key where Snowflake's
      OBJECT_AGG silently skipped the pair - null guards added.
    columns:
      - name: orderguid
        data_type: text
        tests: [unique, not_null]
      - name: orderextracharge_details
        description: 'e.g. {"C": {"DETENTION": 150, "LUMPER": 75}}'
        data_type: jsonb
      - name: manualextracharge_details
        data_type: jsonb

  - name: int_labatt_order_revenue
    description: >
      Port of LABATT_ORDERREVENUE_VW (43,383 rows). Labatt shuttle work is
      billed as ONE manual invoice per month per side; this splits that total
      back across individual orders.

      THE ALLOCATION IS BY SQUARE ROOT OF DISTANCE, not distance. A 100-mile
      move earns ~3x a 10-mile move rather than 10x. Deliberate, and invisible
      unless you read the SQL - which is the whole argument for having it in a
      documented model rather than a view.

      Two paths: MANUAL (matched to the manual invoice one month behind the
      pickup month) and CONSOLIDATED MANUAL (matched by invoice number, no
      offset). TONU orders excluded. Two hardcoded values kept for fidelity -
      a mis-dated invoice GUID shifted an extra month, and one invoice forced
      to the QC side. Both belong in a seed.
    columns:
      - name: orderguid
        data_type: text
        tests: [not_null]
      - name: labatt_orderrevnotax
        description: The allocated per-order revenue used by int_order_charges_with_adjustment.
        data_type: numeric
      - name: orderside
        data_type: text
        tests:
          - accepted_values:
              values: ['QC', 'PORTSIDE']
      - name: source
        data_type: text
        tests:
          - accepted_values:
              values: ['MANUAL', 'CONSOLIDATED MANUAL']

