version: 2

models:
  - name: int_lane_rate_by_customer_lane
    description: >
      Median revenue for a customer on an exact city-to-city lane. Widens to a
      6-month window when the customer/lane pair has nothing in the last 3
      months. First step of the predicted-revenue cascade.
    columns:
      - name: customer
        data_type: text
      - name: od_lane
        data_type: text
      - name: avg_revenue
        description: Median FRT + FSC. A flat amount, not a rate per mile.
        data_type: numeric
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [customer, od_lane]

  - name: int_lane_rate_by_lane
    description: Median revenue on an exact lane, any customer. One row per lane.
    columns:
      - name: od_lane
        data_type: text
        tests: [unique]

  - name: int_lane_rate_by_customer_statelane
    description: >
      Rate per mile for a customer on a state-to-state lane. Excludes lanes
      whose reverse is identical, and trips under 50 miles.
    columns:
      - name: avg_rpm
        description: Median rate per mile. Multiply by total_distance downstream.
        data_type: numeric

  - name: int_lane_rate_by_statelane
    description: >
      Rate per mile on a state lane, any customer. The only model in this layer
      that substitutes EXTRA charges when freight and fuel are both zero.
    columns:
      - name: avg_rpm
        data_type: numeric

  - name: int_lane_rate_by_countrylane
    description: >
      Rate per mile on a country lane. QUIRK: groups by direction and currency
      but keeps one row per (od_countrylane, distancetype), so the surviving
      row's direction is whichever had most orders. int_predicted_revenue joins
      ON direction, so this step frequently finds nothing. Probably unintended -
      worth confirming.
    columns:
      - name: avg_rpm
        data_type: numeric

  - name: int_lane_rate_by_countrylane_direction
    description: Rate per mile on a country lane, kept per direction.

  - name: int_lane_rate_by_direction
    description: >
      Coarsest benchmark - mean rate per mile by direction and distance band.
      Uses AVG not MEDIAN, so outliers pull it. One row per distance band.

  - name: int_lane_rate_by_distinct_state_country_lane
    description: >
      Mean rate per mile on the distinct (first-to-last) state and country lane
      plus whole-order direction. No dedupe.

  - name: int_lane_rate_by_distinct_country_lane
    description: >
      Median rate per mile on the distinct country lane. Collapses LONG and
      VERY LONG into one band.

  - name: int_lane_rate_by_countrylane_roundtrip
    description: >
      Round-trip lanes only - multi-probill orders that return, or are already
      flagged RT. Collapses MEDIUM, LONG and VERY LONG into LONG.
