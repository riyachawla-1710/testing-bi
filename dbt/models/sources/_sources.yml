version: 2

# =============================================================================
# SOURCES
#
# PostgreSQL (AlloyDB) is THE source. Everything below with no `database:` key
# resolves to the database in your dbt profile - i.e. one Postgres database,
# with one schema per microservice.
#
# There is deliberately NO `database: CHARGERFLEET` anywhere. That was
# Snowflake's three-part naming; in Postgres these are plain schemas.
#
# `quoting: identifier: true` is set where a table name is a reserved word
# (`order`, `user`) so dbt emits "order" rather than order.
# =============================================================================

sources:

  # ---------------------------------------------------------------------------
  # The operational database. All of it, directly from Postgres.
  # ---------------------------------------------------------------------------
  - name: probillsvc
    schema: probillsvc
    description: Orders, probills, charges, tax. PostgreSQL.
    quoting:
      identifier: true
    tables:
      - name: order
        description: One row per order. isrowdeleted = 0 for live rows. Reserved word - quoted.
      - name: orderstatus
        quoting: { identifier: false }
      - name: ordercharge
        quoting: { identifier: false }
      - name: orderchargetype
        description: Classifies a charge as Freight Rate / Fuel Surcharge / Extra Charge.
        quoting: { identifier: false }
      - name: orderuser
        description: Maps orders to users by roleid.
        quoting: { identifier: false }
      - name: salesrep
        quoting: { identifier: false }
      - name: probill
        quoting: { identifier: false }
      - name: taxcodes
        quoting: { identifier: false }
      - name: taxitems
        quoting: { identifier: false }
      - name: pickdeldates
        description: Planned and actual pickup/delivery datetimes per probill.
        quoting: { identifier: false }
      - name: po
        description: Purchase orders. pobillingstatusid drives the NON BILLABLE PO rule.
        quoting: { identifier: false }

  - name: invoicesvc
    schema: invoicesvc
    description: Invoicing. PostgreSQL.
    tables:
      - name: invoice
      - name: invoicecharge
      - name: invoiceadjustment
      - name: invoiceorderrel
      - name: currency
        description: Currency short codes - C = CAD, U = USD, P = MXN.

  - name: customersvc
    schema: customersvc
    tables:
      - name: customer

  - name: usersvc
    schema: usersvc
    quoting:
      identifier: true
    tables:
      - name: user
        description: Reserved word - quoted.

  - name: trailersvc
    schema: trailersvc
    tables:
      - name: trailertype
        description: Trailer type name. REEFER matching drives equipmenttype.

  - name: fleetsvc
    schema: fleetsvc
    tables:
      - name: location
        description: Stop locations with lat/lon and parent location.
      - name: jurisdiction
        description: State/province codes. QR->QA, PQ->QC, DF->MX are remapped.

  - name: tripsvc
    schema: tripsvc
    tables:
      - name: tripevent
        description: >
          Trip events per probill. int_tonu_orders uses their ABSENCE to find
          TONU orders - truck ordered, nothing moved.

  - name: addresssvc
    schema: addresssvc
    tables:
      - name: traveltime
        description: >
          Point-to-point mileage and minutes between locations. int_opd_miles
          tries A->B, then B->A, then both parent locations.

  # ---------------------------------------------------------------------------
  # NOT IN POSTGRES YET.
  #
  # Four objects that do not exist in Postgres yet. Each needs a decision, and
  # until it has one, `dbt build` cannot complete against Postgres alone.
  # Listed here with its disposition rather than hidden.
  #
  # The schema below is a placeholder - override it per environment with
  # `--vars` or a profile target once each object has a real home.
  # ---------------------------------------------------------------------------
  - name: pending
    schema: "{{ var('pending_schema', 'pending') }}"
    description: >
      Objects with no PostgreSQL home yet. NOT a Snowflake connection - these
      are placeholders so the DAG is explicit about what is missing.
    tables:

      # --- portable: derived from Postgres data, just not ported yet ---------
      - name: orderlanerevenuemapping
        description: >
          PORTABLE. One row per historically invoiced order with lane, distance
          band, direction and charges. The corpus all ten int_lane_rate_by_*
          models compute from. Derived from Postgres data - porting it makes
          the whole lane-rate layer local. Biggest single win left.
      - name: globalbrokerageanalysis
        description: >
          PORTABLE BUT LARGE - its own project, not a view port. 17,596 chars,
          and its dependency list brings in a whole new tier this repo does not
          model yet: the contract and trip costing layer.
          New sources it needs: CHARGERFLEET.TRIPSVC.{contract, contractcategory,
          contractcharge, contractchargetype, trip, tripcategory, triprole},
          CARRIERSVC.CARRIER, FLEETSVC.DIVISION, PROBILLSVC.ORDERCATEGORY,
          USERSVC.USEREMAILHISTORY - plus BI.ANALYTICS.EVENTFORPROBILL and
          MARKETPLACE_SPOTRATE_VW.
          Only int_ts_hybrid_brokerage_pnl needs it, and that only feeds the
          Revenue Execution dashboards - NOT Revenue Performance. Safe to defer.
      - name: ordercartaportelifecycle
        description: >
          NOT A SIMPLE VIEW PORT - investigated 2026-09-08.
          The TABLE (138,033 rows) supplies matchrateinbound / matchrateoutbound
          to int_ts_hybrid_brokerage_pnl. But ORDERCARTAPORTELIFECYCLE_VW is
          SELF-REFERENTIAL: it reads the very table it is named after, and
          produces a DIFFERENT set of columns (invoice/CFDI reporting fields),
          none of which are the match rates. So porting that view does not
          unblock the brokerage P&L.
          It also pulls in CHARGERFLEET.INVOICINGMXSVC - eight tables of Mexican
          CFDI/Carta Porte invoicing (comprobante, cartaporte, emisor, receptor,
          moneda, cartaporteubicacion, cartaporterequest, invoicelocation) -
          plus BI.ANALYTICS.CARTAPORTEWDINVOICES_VW.
          NEXT STEP: find the job that actually POPULATES the table (a task or
          stored procedure, not this view) and port that instead.

      # --- NOT portable: these read other systems ---------------------------
      - name: ordercharges_bs_vw
        description: >
          NOT PORTABLE AS-IS (7,532 chars). Reads OPSYNC.BILLINGSYSTEM.ORDERCHARGE.
          Powers the "BILLING SYSTEM" step of the predicted-revenue cascade.
          Needs OPSYNC data landed somewhere Postgres can reach, or the step
          dropped.

  # ---------------------------------------------------------------------------
  # Workday FX. Also not Postgres.
  # ---------------------------------------------------------------------------
  - name: fx
    schema: "{{ var('fx_schema', 'pending') }}"
    description: >
      Bank of Canada daily rates, currently only in WORKDAYBI. Blocks every
      CAD/USD conversion on the dashboard. Small daily table - land it in
      Postgres, or pull it from the Bank of Canada valet API on a schedule.
    tables:
      - name: bocdailyfxrates
        description: >
          Columns "USD/CAD" and "MXN/CAD" are quoted because of the slash.
          Rename them on landing (usd_cad, mxn_cad) and simplify
          int_fx_rates_daily accordingly.
