version: 2

# =============================================================================
# SOURCES
#
# PostgreSQL (AlloyDB) is THE source. Everything below with no `database:` key
# resolves to the database in your dbt profile - i.e. one Postgres database,
# with one schema per microservice.
#
# There is deliberately NO `database: CHARGERFLEET` anywhere. That was
# Snowflake's three-part naming; in Postgres these are plain schemas.
#
# `quoting: identifier: true` is set where a table name is a reserved word
# (`order`, `user`) so dbt emits "order" rather than order.
# =============================================================================

sources:

  # ---------------------------------------------------------------------------
  # The operational database. All of it, directly from Postgres.
  # ---------------------------------------------------------------------------
  - name: probillsvc
    schema: probillsvc
    description: Orders, probills, charges, tax. PostgreSQL.
    quoting:
      identifier: true
    tables:
      - name: order
        description: One row per order. isrowdeleted = false for live rows. Reserved word - quoted.
      - name: orderstatus
        quoting: { identifier: false }
      - name: ordercharge
        quoting: { identifier: false }
      - name: orderchargetype
        description: Classifies a charge as Freight Rate / Fuel Surcharge / Extra Charge.
        quoting: { identifier: false }
      - name: orderuser
        description: Maps orders to users by roleid.
        quoting: { identifier: false }
      - name: salesrep
        quoting: { identifier: false }
      - name: probill
        quoting: { identifier: false }
      - name: taxcodes
        quoting: { identifier: false }
      - name: taxitems
        quoting: { identifier: false }
      - name: pickdeldates
        description: Planned and actual pickup/delivery datetimes per probill.
        quoting: { identifier: false }
      - name: po
        description: Purchase orders. pobillingstatusid drives the NON BILLABLE PO rule.
        quoting: { identifier: false }

  - name: invoicesvc
    schema: invoicesvc
    description: Invoicing. PostgreSQL.
    tables:
      - name: invoice
      - name: invoicecharge
      - name: invoiceadjustment
      - name: invoiceorderrel
      - name: currency
        description: Currency short codes - C = CAD, U = USD, P = MXN.

  - name: customersvc
    schema: customersvc
    tables:
      - name: customer

  - name: usersvc
    schema: usersvc
    quoting:
      identifier: true
    tables:
      - name: user
        description: Reserved word - quoted.

  - name: trailersvc
    schema: trailersvc
    tables:
      - name: trailertype
        description: Trailer type name. REEFER matching drives equipmenttype.

  - name: fleetsvc
    schema: fleetsvc
    tables:
      - name: location
        description: Stop locations with lat/lon and parent location.
      - name: jurisdiction
        description: State/province codes. QR->QA, PQ->QC, DF->MX are remapped.

  - name: tripsvc
    schema: tripsvc
    tables:
      - name: tripevent
        description: >
          Trip events per probill. int_tonu_orders uses their ABSENCE to find
          TONU orders - truck ordered, nothing moved.

  - name: addresssvc
    schema: addresssvc
    tables:
      - name: traveltime
        description: >
          Point-to-point mileage and minutes between locations. int_opd_miles
          tries A->B, then B->A, then both parent locations.

# =============================================================================
# EVERY SOURCE IN THIS FILE IS A PLAIN POSTGRESQL SCHEMA.
#
# There is no `pending` group and no `fx` group any more. The five objects that
# used to live there - orderlanerevenuemapping, globalbrokerageanalysis,
# ordercartaportelifecycle, ordercharges_bs_vw and bocdailyfxrates - were each
# read by exactly one thing, and all of those things are gone:
#
#   orderlanerevenuemapping   -> the ten int_lane_rate_by_* models   (deleted)
#   ordercharges_bs_vw        -> int_predicted_revenue               (deleted)
#   globalbrokerageanalysis   -> int_ts_hybrid_brokerage_pnl         (deleted)
#   ordercartaportelifecycle  -> int_ts_hybrid_brokerage_pnl         (deleted)
#   bocdailyfxrates           -> int_fx_rates_daily                  (deleted)
#
# So `dbt build` now has zero unresolvable dependencies. If you re-introduce
# predicted revenue, brokerage P&L or currency conversion later, these are the
# five objects that have to land in Postgres first. Their full analysis is in
# git history at commit 1792a28.
# =============================================================================
