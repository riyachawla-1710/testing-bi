version: 2

seeds:
  - name: sales_report_access
    description: >
      Sales rep to business unit mapping. Was BI.ANALYTICS.SALESREPORTACCESS -
      a 59-row hand-maintained config table in Snowflake, which is exactly what
      a dbt seed is for. Now version-controlled: changes arrive as pull
      requests instead of someone editing a Snowflake table.

      This is the table that should drive row-level security in Cube. In
      Tableau, business unit is an open filter any viewer can widen.

      DATA QUALITY, preserved as found - clean it deliberately, not by accident:
        * the Snowflake table stores the literal string 'NULL' in several
          id columns; those are empty here
        * several userid values had trailing spaces ('Stephane ', 'Iyad ',
          'tim ', 'Tyler ', 'carlos.diego '); trimmed here
        * 10 of 59 rows are status = Inactive but still present
        * 23 distinct business unit codes across 59 people
    config:
      column_types:
        username: varchar(255)
        userid: varchar(255)
        designation: varchar(255)
        salesrepid: varchar(255)
        managerid: varchar(255)
        branchleadid: varchar(255)
        regionalbranchleadid: varchar(255)
        defaultcurrency: varchar(255)
        businessunitcode: varchar(255)
        businessunitdescription: varchar(255)
        status: varchar(50)
    columns:
      - name: username
        description: Joined to salesrep on upper(username) = upper(salesrep).
        tests: [not_null]
      - name: businessunitcode
        description: 23 distinct values. The row-level security key.
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['Active', 'Inactive']
