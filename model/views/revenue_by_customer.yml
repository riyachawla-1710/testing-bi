# Powers the "Revenue Performance Analysis" dashboard.
# Tiles: Customer: Revenue Performance, Trend: Revenue Performance,
#        Revenue Performance (monthly), Trend: YoY Revenue Performance.
#
# `currency` is included and must be used. Money here is unconverted.
views:
  - name: revenue_by_customer
    description: >
      Revenue and order volume by customer and delivery month, in the order's
      own currency. Always group or filter by `currency` - nothing is
      FX-converted, so an ungrouped total adds CAD to USD to MXN.
      Replaces the Tableau workbook of the same name.
    cubes:
      - join_path: order_revenue
        includes:
          # the mandatory slice
          - currency
          # filters shown on the dashboard
          - customer
          - sales_rep
          - spot_flag
          - revenue_status
          - delivered_date
          - delivered_year
          - delivered_month_of_year
          # measures
          - order_count
          - invoiced_order_count
          - revenue_fsc_only
          - revenue_incl_fsc
          - revenue_ex_fsc
          - manual_charges
          - revenue_with_manual_charges
          - revenue_per_invoiced_order
          - fsc_share_of_revenue
