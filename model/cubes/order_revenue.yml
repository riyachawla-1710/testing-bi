# =============================================================================
# order_revenue
#
# Sits on the dbt mart `reporting.fct_order_revenue` (see /dbt).
# Replaces the custom SQL + calculated fields inside the Tableau workbook
# "Revenue Performance Analysis.twbx".
#
# Kept private on purpose - dashboards and BI tools should point at the views
# in model/views, not at this cube.
#
# READ THIS BEFORE ADDING A MEASURE ------------------------------------------
# There is no currency conversion anywhere in this stack. Every money measure
# below is in the ORDER'S OWN currency, so every money measure must be sliced
# by `currency`. A revenue total without it is CAD + USD + MXN added together.
# The pre-aggregations all carry `currency` for exactly this reason - do not
# remove it from them.
# =============================================================================
cubes:
  - name: order_revenue
    sql_table: reporting.fct_order_revenue
    data_source: default          # PostgreSQL / AlloyDB read pool
    public: false
    description: >
      One row per order, in the order's own currency - nothing is converted, so
      always group or filter by `currency`. Revenue exists only for INVOICED
      orders; non-invoiced orders keep their row (so volume and lane analysis
      stay complete) but have NULL revenue. Use `revenue_status` to separate
      them.

    dimensions:
      - name: orderno
        sql: orderno
        type: number
        primary_key: true
        description: Order number. Unique per order.

      # --- the mandatory slice ----------------------------------------------
      - name: currency
        sql: order_currency
        type: string
        description: >
          CAD, USD or MXN - the currency the order was billed in. MANDATORY on
          any query that returns a money measure. Nothing in this stack is
          FX-converted, so a revenue figure that is not grouped or filtered by
          currency is meaningless.

      - name: customer
        sql: customer
        type: string
        description: Customer legal business name. 1,756 distinct values.

      - name: sales_rep
        sql: salesrep
        type: string
        description: Sales rep, upper-cased. 'NONE' when unassigned.

      - name: spot_flag
        sql: spot_status
        type: string
        description: Spot vs contract. Two values.

      - name: revenue_status
        sql: revenue_status
        type: string
        description: >
          INVOICED or NOT INVOICED. Revenue is NULL for NOT INVOICED - there is
          no modelled figure behind them any more. Filter to INVOICED for any
          revenue question; leave both in for volume questions.

      - name: pickup_city
        sql: pickcity
        type: string
      - name: pickup_state
        sql: pickstate
        type: string
      - name: pickup_country
        sql: pickcountry
        type: string
      - name: delivery_city
        sql: delcity
        type: string
      - name: delivery_state
        sql: delstate
        type: string
      - name: delivery_country
        sql: delcountry
        type: string

      - name: lane
        sql: lane
        type: string
        description: >
          Origin-destination lane. 24,537 distinct values - high cardinality,
          do not put it in a pre-aggregation.

      - name: delivered_date
        sql: delivereddate
        type: time
        description: The reporting date for every tile on every dashboard.

      - name: pickup_date
        sql: pickedupdate
        type: time

      - name: invoice_date
        sql: invoicedate
        type: time
        description: NULL for orders that are not invoiced.

      # Pre-computed so the YoY tile does not need EXTRACT() at query time,
      # and so both parts can live in a pre-aggregation.
      - name: delivered_year
        sql: "EXTRACT(YEAR FROM {CUBE}.delivereddate)"
        type: number
        description: Calendar year of delivery. Used by the YoY tiles.

      - name: delivered_month_of_year
        sql: "EXTRACT(MONTH FROM {CUBE}.delivereddate)"
        type: number
        description: Month number 1-12, ignoring year. Used by the YoY tiles.

      - name: manual_charges_currency_mismatch
        sql: manual_charges_currency_mismatch
        type: boolean
        description: >
          TRUE when the order carries manual charges billed in a currency other
          than its own. Those amounts are EXCLUDED from `manual_charges` because
          there is no rate to convert them with. This is a data-quality lens,
          not a reporting dimension - check how many orders it hits before
          trusting any revenue-plus-manual-charges figure.

    measures:
      # --- volume. Safe to query without a currency slice. -------------------
      - name: order_count
        type: count_distinct
        sql: orderno
        description: >
          Distinct orders, invoiced or not. Shown as "Total Orders". Exact
          distinct count - it does NOT combine additively, which is why the
          order_grain pre-aggregation below exists.

      - name: invoiced_order_count
        type: count_distinct
        sql: orderno
        filters:
          - sql: "{CUBE}.revenue_status = 'INVOICED'"
        description: >
          Distinct invoiced orders - the denominator for any revenue-per-order
          figure. order_count includes non-invoiced orders, which have no
          revenue, so dividing revenue by order_count understates it.

      # --- revenue. ALWAYS slice by currency. --------------------------------
      # Three NAMED measures rather than one parameter. The Tableau workbook
      # used a single measure whose meaning changed with the "fsc Revenue
      # Toggle" parameter (default: fsc Only), so nobody could tell which
      # number they were looking at.
      - name: revenue_fsc_only
        type: sum
        sql: order_fsc_revenue
        format: currency
        description: >
          Fuel-surcharge revenue only, in the order's own currency. Equivalent
          to the 'fsc Only' toggle. Slice by currency.

      - name: revenue_incl_fsc
        type: sum
        sql: order_revenue
        format: currency
        description: >
          Total order revenue including fuel surcharge, in the order's own
          currency. The 'fsc Inclusive' toggle, and the closest equivalent to
          the headline Tableau number. Slice by currency.

      - name: revenue_ex_fsc
        type: sum
        sql: order_revenue_ex_fsc
        format: currency
        description: >
          Total order revenue excluding fuel surcharge, in the order's own
          currency. The 'fsc Exclusive' toggle. Slice by currency.

      - name: manual_charges
        type: sum
        sql: manual_charges
        format: currency
        description: >
          Manual (off-invoice) charges, in the order's own currency only.
          Charges billed in a different currency are excluded - see the
          manual_charges_currency_mismatch dimension. Slice by currency.

      - name: revenue_with_manual_charges
        type: sum
        sql: "COALESCE(order_revenue, 0) + COALESCE(manual_charges, 0)"
        format: currency
        description: >
          revenue_incl_fsc plus manual charges. COALESCE means a non-invoiced
          order with manual charges contributes those charges and no revenue.
          Slice by currency.

      # --- data quality ------------------------------------------------------
      - name: currency_mismatch_order_count
        type: count_distinct
        sql: orderno
        filters:
          - sql: "{CUBE}.manual_charges_currency_mismatch"
        description: >
          How many orders have manual charges in a foreign currency that are
          therefore being dropped from manual_charges. Check this before
          quoting revenue_with_manual_charges to anyone.

      # --- ratios: computed AFTER aggregation, never per row ----------------
      - name: revenue_per_invoiced_order
        sql: "{revenue_incl_fsc} / NULLIF({invoiced_order_count}, 0)"
        type: number
        format: currency
        description: >
          SUM(revenue) / COUNT(invoiced orders). Must be post-aggregation -
          computing it per order and averaging gives a different, wrong answer.
          Slice by currency.

      - name: fsc_share_of_revenue
        sql: "{revenue_fsc_only} / NULLIF({revenue_incl_fsc}, 0)"
        type: number
        format: percent
        description: >
          What proportion of revenue is fuel surcharge. Currency-neutral as a
          ratio, but the numerator and denominator must come from the same
          currency - so still slice by currency.

    # -------------------------------------------------------------------------
    # Row-level security - NOT CONFIGURED.
    #
    # The previous version filtered rows by a `business_unit` user attribute
    # sourced from the SALESREPORTACCESS seed. That seed is removed, so there is
    # no business-unit dimension to filter on and no policy here.
    #
    # If rep-level scoping is needed, the cheapest route is a `sales_rep` user
    # attribute filtering the `sales_rep` dimension directly:
    #
    #   access_policy:
    #     - group: default
    #       member_level:
    #         includes: "*"
    #     - group: sales_rep
    #       row_level:
    #         filters:
    #           - member: sales_rep
    #             operator: equals
    #             values: ["{ securityContext.sales_rep }"]
    #
    # Cube requires `group:` (or `groups:`) here, NOT `role:`. It will fail to
    # compile until the attribute and the group both exist.
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # Pre-aggregations. These are what keep AlloyDB out of the request path:
    # dashboards read Cube Store, and Postgres sees ~1 query per refresh.
    #
    # `currency` is in every one of them on purpose. A rollup that drops it
    # would sum across currencies inside Cube Store, where nobody would see it.
    # -------------------------------------------------------------------------
    pre_aggregations:
      - name: order_grain
        # Needed because order_count is an exact count_distinct, which cannot
        # be rolled up from a coarser aggregate.
        dimensions:
          - orderno
          - currency
          - customer
          - sales_rep
          - spot_flag
          - revenue_status
        time_dimension: delivered_date
        granularity: day
        partition_granularity: month
        refresh_key:
          every: 1 hour

      - name: customer_month
        measures:
          - revenue_fsc_only
          - revenue_incl_fsc
          - revenue_ex_fsc
          - manual_charges
          - revenue_with_manual_charges
        dimensions:
          - currency
          - customer
          - sales_rep
          - spot_flag
          - revenue_status
        time_dimension: delivered_date
        granularity: month
        partition_granularity: year
        refresh_key:
          every: 1 hour

      - name: yoy_month
        measures:
          - revenue_incl_fsc
          - revenue_fsc_only
        dimensions:
          - currency
          - delivered_year
          - delivered_month_of_year
          - customer
          - sales_rep
        time_dimension: delivered_date
        granularity: month
        partition_granularity: year
        refresh_key:
          every: 1 hour
